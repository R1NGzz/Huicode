[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huicode"
version = "0.1.0"
description = "HuiCode: a streaming command-line AI assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HuiCode" }]
dependencies = ["rich>=13", "prompt_toolkit>=3", "PyYAML>=6"]

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "redis>=5,<7",
    "PyJWT>=2.9,<3",
    "argon2-cffi>=23.1,<26",
]
server-test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "aiosqlite>=0.20,<1"]

[project.scripts]
huicode = "huicode.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["huicode*"]

[tool.setuptools.package-data]
"huicode.skills" = ["builtin/*/SKILL.md"]
"huicode.subagents" = ["builtin/*.md"]
